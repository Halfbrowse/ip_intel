# Forward proxy for ip_intel, running inside the ProtonVPN container's network
# namespace so its egress IP is always the current VPN exit IP.
#
# Reached by the app on shared_net as http://protonvpn-cli:8888. Because the
# proxy shares the VPN netns, the app's requests arrive from the docker network
# gateway, NOT 127.0.0.1 — so the default tinyproxy "Allow 127.0.0.1" would
# reject them. We allow RFC1918 ranges (docker bridge networks) instead.

Port 8888
Listen 0.0.0.0
Timeout 600

# Allow clients on private/docker networks (shared_net, default bridge).
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Don't advertise the proxy / leak client IP to upstreams.
DisableViaHeader Yes

LogLevel Info
MaxClients 100
