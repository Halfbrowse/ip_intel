[project]
name = "ip-intel"
version = "0.1.0"
description = "Domain/IP intelligence tool — DNS, WHOIS, subdomains, reverse IP"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
    "python-whois>=0.9",
    "requests[socks]>=2.31",
    "ipwhois>=1.2",
    "python-dotenv>=1.0",
    "censys-platform>=0.13.4",
    "shodan>=1.31",
    "netlas>=0.5",
    "httpx[socks]>=0.27",
    "cryptography>=42.0",
    "colorama>=0.4.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "pycti>=6.0",
    "libmagic>=1.0",
    "tqdm>=4.66",
    "mmh3>=5.1",
    "paramiko>=3.5",
    "pytest>=8.3",
]

[project.scripts]
ip-intel = "core.ip_intel:main"

[tool.pytest.ini_options]
pythonpath = ["."]
