[project]
name = "ip-intel"
version = "0.1.0"
description = "Domain/IP intelligence tool — DNS, WHOIS, subdomains, reverse IP"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
    "python-whois>=0.9",
    "requests>=2.31",
    "ipwhois>=1.2",
    "python-dotenv>=1.0",
    "censys-platform>=0.13.4",
    "shodan>=1.31",
    "netlas>=0.5",
    "httpx>=0.27",
    "cryptography>=42.0",
    "colorama>=0.4.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pycti>=6.0",
    "libmagic>=1.0",
]

[project.scripts]
ip-intel = "ip_intel:main"
ip-intel-api = "app:run"
