services:
  # Optional VPN egress for outbound provider traffic (rate-limit bypass).
  # Only started with: docker compose --profile vpn up
  # Then set OUTBOUND_PROXY_URL=http://vpn:8888 (e.g. in .env) so ip-intel
  # routes provider HTTP calls through gluetun's built-in HTTP proxy.
  vpn:
    image: qmcgaw/gluetun
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      # VPN credentials/config come from .env — see gluetun docs for your provider.
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      # Built-in HTTP proxy, reachable on the compose network as vpn:8888.
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ip_intel
      POSTGRES_USER: ip_intel
      POSTGRES_PASSWORD: ip_intel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ip_intel -d ip_intel"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ip-intel:
    build: .
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ip_intel:ip_intel@postgres:5432/ip_intel
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:9000}
      # With the `vpn` profile active, set OUTBOUND_PROXY_URL=http://vpn:8888
      # to route outbound provider HTTP calls through the VPN. Empty = direct.
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  postgres_data:
